[package]
name = "utils"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
[dependencies]
ahash = "0.8"
chrono = "0.4.43"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
solana-sdk = { version = "4.0.0", features = ["full"] }
ta = "0.5.0"
grpc-client = { git = "https://github.com/miaomiaowu0428/grpc-client.git", branch = "supportV1" }
spl-associated-token-account = "8.0.0"
anyhow = "1.0.100"
tokio = "1.49.0"
solana-client = "4.2.2"
serde_json = "1.0.149"
spl-token-interface = "3.0.0"
spl-token-2022-interface = "3.1.1"
whirlwind = { git = "https://github.com/miaomiaowu0428/whirlwind.git" }
async-trait = "0.1.89"
inventory = "0.3"
solana-address-lookup-table-interface = "3.1.0"
solana-transaction-context = "4.2.2"
solana-transaction-error = { version = "3.3.2", features = ["serde"] }
solana-transaction-status = { version = "4.2.2", features = ["agave-unstable-api"] }
solana-transaction-status-client-types = { version = "4.2.2", features = ["agave-unstable-api"] }
bs58 = "0.5.1"
base64 = "0.22"
dotenvy = "0.15.7"
futures = "0.3.31"
flexi_logger = { version = "0.31.8", features = ["async"] }
const-accounts = { git = "https://github.com/miaomiaowu0428/const-accounts.git", branch = "supportV1" }
